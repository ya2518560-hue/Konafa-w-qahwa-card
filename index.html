<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كارت الولاء</title>
<style>
:root{--bg:#EDD8B8;--ink:#3b241b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1c1411;color:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:400px}
.card{background:var(--bg);color:var(--ink);border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--ink)}
h1{margin:8px 0 0;font-size:24px}.sub{opacity:.8;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.s{aspect-ratio:1;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.s.f{background:var(--ink);color:var(--bg)}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin-top:6px}
.qr img,.qr canvas{display:block}
.rw{font-weight:700;margin:6px 0}.done{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px;margin:8px 0;font-weight:700}
input,button{font:inherit;width:100%;padding:13px;border-radius:12px;border:2px solid var(--ink);margin:6px 0;background:#fff;color:#222}
button{background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.hide{display:none}.mut{opacity:.7;font-size:13px}
</style>
</head>

<img id="logo" class="logo" alt="">
<h1 id="nm"></h1><div class="sub" id="sb"></div>
<div id="signup" class="hide">
  <div id="wl" class="rw"></div>
  <input id="n" placeholder="اسمك"><input id="p" type="tel" inputmode="tel" placeholder="رقم الموبايل">
  <button id="go">إنشاء كارتي</button><div id="er" class="mut"></div>
</div>
<div id="cardv" class="hide">
  <div class="rw" id="hi"></div>
  <div class="grid" id="gr"></div>
  <div id="dn" class="done hide"></div>
  <div class="mut" id="rwd"></div>
  <div class="qr" id="qr"></div>

</div>

let cfg=D,cust=null,cid=new URLSearchParams(location.search).get("c")||localStorage.getItem("cid"),qrFor=null;
function render(){
  document.documentElement.style.setProperty("--bg",cfg.bg);document.documentElement.style.setProperty("--ink",cfg.ink);
  $("logo").src=cfg.logo;$("nm").textContent=cfg.name;$("sb").textContent=cfg.sub;$("wl").textContent=cfg.welcome;
  $("signup").classList.toggle("hide",!!cust);$("cardv").classList.toggle("hide",!cust);
  if(!cust)return;
  const need=+cfg.need,have=Math.min(cust.stamps,need);
  $("hi").textContent="أهلا "+cust.name+" — "+cust.stamps+" / "+need;
  $("gr").innerHTML=Array.from({length:need},(_,i)=>`<div class="s ${i<have?"f":""}">${i<have?"☕":""}</div>`).join("");
  $("dn").classList.toggle("hide",cust.stamps<need);$("dn").textContent="🎉 كارتك اكتمل! استلم: "+cfg.reward;
  $("rwd").textContent="الجائزة عند "+need+" أختام: "+cfg.reward+(cust.rewards?" | استلمت "+cust.rewards+" مرة":"");
  if(qrFor!==cid){qrFor=cid;$("qr").innerHTML="";new QRCode($("qr"),{text:"KQ:"+cid,width:190,height:190})}
}
db.collection("config").doc("main").onSnapshot(s=>{cfg={...D,...(s.exists?s.data():{})};render()});
function watch(){db.collection("customers").doc(cid).onSnapshot(s=>{if(s.exists){cust=s.data()}else{cust=null;localStorage.removeItem("cid")}render()})}
if(cid)watch();
$("go").onclick=async()=>{
  const name=$("n").value.trim(),phone=$("p").value.trim();
  if(!name||phone.length<8)return $("er").textContent="اكتب اسمك ورقم موبايل صحيح";
  try{const r=await db.collection("customers").add({name,phone,stamps:0,rewards:0,created:firebase.firestore.FieldValue.serverTimestamp()});
    cid=r.id;localStorage.setItem("cid",cid);history.replaceState(null,"","?c="+cid);watch()}
  catch(e){$("er").textContent="حصلت مشكلة، حاول تاني"}
};
render();
</script>
